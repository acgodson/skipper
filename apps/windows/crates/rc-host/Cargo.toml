[package]
name = "rc-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The RemoteControl host for Windows. --synthetic runs the same binary on macOS/Linux for interop testing against the real Mac controller."

[features]
# require-admin embeds the requireAdministrator manifest (UAC elevation). On by
# default for the shipping build; build with --no-default-features for the
# no-elevation test build that runs cleanly over AnyDesk.
default = ["require-admin"]
require-admin = []

[dependencies]
rc-proto = { path = "../../../../core/crates/rc-proto" }
rc-input = { path = "../rc-input" }
rc-session = { path = "../../../../core/crates/rc-session" }
rc-identity = { path = "../../../../core/crates/rc-identity" }
rc-signal-client = { path = "../rc-signal-client" }
rc-transport = { path = "../rc-transport" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
bytes.workspace = true
base64.workspace = true
sha2.workspace = true
openh264.workspace = true
reqwest.workspace = true
subtle = { version = "2.6", default-features = false }
rand_core.workspace = true

# Console Ctrl-C and window-close handling, so the host releases every held key
# before it exits. Windows only on purpose: tokio's signal backend there is the
# OS API, while on unix it adds signal-hook-registry and errno to the graph for
# a build that only ever records input.
[target.'cfg(windows)'.dependencies.tokio]
workspace = true
features = ["signal"]

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D",
  "Win32_Graphics_Gdi",
  "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
  "Win32_System_Power", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Threading", "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Console",
  "Win32_Media_MediaFoundation", "Win32_System_Com",
  "Win32_Foundation",
]
