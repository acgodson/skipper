# coturn — fallback relay for authenticated remote-control sessions ONLY.
# This must never be usable as a general Internet proxy.

listening-port=3478
# EXTERNAL_IP is substituted by deploy.sh with <elastic-ip>/<private-ip>
external-ip=__EXTERNAL_IP__
listening-ip=0.0.0.0
relay-ip=__PRIVATE_IP__

min-port=49160
max-port=49200

# Ephemeral credentials minted by rc-signal (coturn REST auth). No static users, ever.
use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=rc.local

fingerprint
no-cli
no-tlsv1
no-tlsv1_1

# --- anti-proxy hardening -------------------------------------------------
# Refuse to relay to anything on a private, loopback, link-local or reserved range.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# TCP relay is not needed for our media path; leaving it off shrinks the attack surface.
no-tcp-relay

# --- quotas: protect the shared box, without throttling the desktop stream -----
# Bound exposure by ALLOCATION COUNT, not bandwidth.
#
# Deliberately NOT setting max-bps / bps-capacity. coturn's bandwidth-quota subsystem
# rejects allocations with error 486 (Allocation Bandwidth Quota Reached) whenever
# bps-capacity is set, and a static per-allocation ceiling is the wrong tool anyway:
# WebRTC's own bandwidth estimation already adapts the encoder to the real path, which
# is exactly the behaviour PLAN.md section 5 depends on. A hard cap here would fight it
# and produce a slideshow on the one path we fall back to when nothing else works.
#
# This is a 1:1 personal system: two allocations is a session, more is a bug.
user-quota=6
total-quota=12

# Do not log session payload or credentials.
no-stdout-log
log-file=stdout
simple-log
