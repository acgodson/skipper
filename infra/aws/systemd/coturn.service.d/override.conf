# Drop-in over the coturn unit Ubuntu ships. /etc/turnserver.conf holds the
# static-auth-secret, so it is 0640 root:turnserver and coturn drops to that user itself.

[Service]
Restart=always
RestartSec=5
RuntimeDirectory=turnserver
RuntimeDirectoryMode=0750
LogsDirectory=turnserver
LogsDirectoryMode=0750

NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
SystemCallArchitectures=native
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=CAP_SETUID CAP_SETGID
ReadWritePaths=/var/log/turnserver /run/turnserver
