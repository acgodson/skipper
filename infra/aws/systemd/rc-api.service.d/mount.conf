# rc-api must not start before /var/lib/<project> is the data volume. Without this it
# would open a fresh empty rc-api.db on the root volume under the mount point, serve from
# it, and mint Device IDs that the real claims database has never heard of.
#
# RequiresMountsFor turns the path into Requires= plus After= on the .mount unit systemd
# generates from the fstab entry, so the dependency is the mount itself rather than a
# guess at how long it takes. The fstab entry carries nofail, so a volume that never
# arrives leaves the box booted and reachable over SSM while this unit stays down.
#
# It is a drop-in rather than a line in rc-api.service so that the unit file and this
# requirement can be changed independently.
[Unit]
RequiresMountsFor=${data_dir}
