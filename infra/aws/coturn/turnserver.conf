# coturn, REST-API shared-secret mode. Terraform renders this file, so the placeholders
# below are substituted at apply time; static-auth-secret is filled in by cloud-init from
# SSM, because coturn reads its secret only from this file and never from a flag.

listening-port=${turn_listen_port}
tls-listening-port=0
min-port=${turn_relay_min_port}
max-port=${turn_relay_max_port}

listening-ip=0.0.0.0
external-ip=${external_ip}
realm=${turn_realm}

use-auth-secret
static-auth-secret=__TURN_STATIC_AUTH_SECRET__

no-tcp-relay
no-multicast-peers
no-cli
no-software-attribute
fingerprint
stale-nonce=600

user-quota=${turn_user_quota}
total-quota=${turn_total_quota}

proc-user=turnserver
proc-group=turnserver
pidfile=/run/turnserver/turnserver.pid

simple-log
no-stdout-log
log-file=/var/log/turnserver/turnserver.log

# An open relay into our own VPC, into the instance itself, or into the instance metadata
# service would be a finding on its own. Everything that is not a public unicast address
# is refused as a peer; 169.254.169.254 is inside the link-local range below.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
# `denied-peer-ip=::` is deliberately absent. coturn 4.6.1 stores a single address as a
# range whose comparison ignores the address family, so the all-zero IPv6 address matches
# every IPv4 peer too and the one line denies the whole internet: coturn still hands out an
# allocation, then refuses CreatePermission for every peer, which is a relay that allocates
# and never carries a byte. The IPv4 unspecified address is already covered by the
# 0.0.0.0-0.255.255.255 range above, so the line protected nothing.
# Re-proven by scripts/verify-turn.sh.
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b:0:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100:0:0:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
