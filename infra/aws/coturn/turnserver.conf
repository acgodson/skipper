# coturn, REST-API shared-secret mode. Terraform renders this file, so the placeholders
# below are substituted at apply time; static-auth-secret is filled in by cloud-init from
# SSM, because coturn reads its secret only from this file and never from a flag.

listening-port=${turn_listen_port}
tls-listening-port=0
min-port=${turn_relay_min_port}
max-port=${turn_relay_max_port}

listening-ip=0.0.0.0
external-ip=${external_ip}
realm=${turn_realm}

use-auth-secret
static-auth-secret=__TURN_STATIC_AUTH_SECRET__

no-tcp-relay
no-multicast-peers
no-cli
no-software-attribute
fingerprint
stale-nonce=600

user-quota=${turn_user_quota}
total-quota=${turn_total_quota}

# Concurrent allocations are not bytes. These two are, and without them relay egress had
# no ceiling at all: the t4g.small NIC was the only limit, at roughly 28.8 GB/hour of
# billed egress against a $50 monthly budget that only emails at 80%.
#
# Both are BYTES per second, not bits, and coturn counts the input and output streams
# separately — confirmed against this build's own man page (coturn 4.6.1-1build4):
# "max-bps: Max bytes-per-second bandwidth a TURN session is allowed to handle (input and
# output network streams are treated separately)". A limit of N therefore permits N in and
# N out, which is exactly one relayed direction, so both are sized per direction.
#
# The derivation is in infra/aws/README.md "Relay bandwidth". Briefly: max-bps covers the
# 8 Mbps ceiling the shipped client asks for in *every* quality mode including `auto`
# (QualityProfile.swift burstBitrateBps), plus the data channels, framing and a queueing
# margin; bps-capacity is 90% of the instance's published sustained network baseline split
# across the two directions. Neither is a cost control on its own — a rate cap bounds the
# blast radius per instant, and only the NetworkOut alarm bounds the month.
max-bps=${turn_max_bps}
bps-capacity=${turn_bps_capacity}

proc-user=turnserver
proc-group=turnserver
pidfile=/run/turnserver/turnserver.pid

simple-log
no-stdout-log
log-file=/var/log/turnserver/turnserver.log

# Session accounting, and a deliberate exception to the logging rule. Without `verbose`
# this log held zero allocation lines and zero byte counters, so a relayed byte could not
# be attributed to anything and abuse was invisible. coturn 4.6.1 gates its `usage:` lines
# (rp/rb/sp/sb) on TURN_LOG_LEVEL_INFO, which only `verbose` admits; there is no
# accounting-only switch, the build has no prometheus exporter, and the admin CLI is kept
# shut by `no-cli`. So this is the only lever that exists.
#
# What now lands on disk, exactly:
#   - `usage:` lines per session: realm, the TURN username, received/sent packets and
#     received/sent bytes. The username is `<expiry>:<sessionId>`, so the session id is in
#     it, which is what makes bytes attributable to an account through /v1/sessions.
#   - allocation, CreatePermission and ChannelBind lines naming the **peer address**.
#   - session `closed` lines naming the local and remote addresses.
#
# Session ids, byte counts and timings are all on API.md §9's and PROTOCOL.md §8's allowed
# list already. The **peer addresses are not**, and they are a user's public IP: that is
# the exception, and it is recorded in infra/aws/README.md "The relay log exception" with
# its retention. The TURN password is never logged — only the username, which is public to
# the peer anyway and is useless without the HMAC. Containment: logrotate keeps 7 days
# (infra/aws/logrotate/coturn), and cloudwatch-agent.json deliberately does **not** collect
# turnserver.log, so these addresses stay on the instance's own encrypted volume and never
# reach a log group, a 30-day retention or any other account.
verbose

# An open relay into our own VPC, into the instance itself, or into the instance metadata
# service would be a finding on its own. Everything that is not a public unicast address
# is refused as a peer; 169.254.169.254 is inside the link-local range below.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
# `denied-peer-ip=::` is deliberately absent. coturn 4.6.1 stores a single address as a
# range whose comparison ignores the address family, so the all-zero IPv6 address matches
# every IPv4 peer too and the one line denies the whole internet: coturn still hands out an
# allocation, then refuses CreatePermission for every peer, which is a relay that allocates
# and never carries a byte. The IPv4 unspecified address is already covered by the
# 0.0.0.0-0.255.255.255 range above, so the line protected nothing.
# Re-proven by scripts/verify-turn.sh.
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b:0:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100:0:0:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
