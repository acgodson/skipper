[package]
name = "rc-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "C ABI over rc-session and rc-identity, so the platform apps drive the one session state machine and the one access-code exchange."

[lib]
name = "rc_ffi"
crate-type = ["staticlib"]

[dependencies]
rc-proto = { path = "../rc-proto" }
rc-session = { path = "../rc-session" }
rc-identity = { path = "../rc-identity" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
base64.workspace = true
