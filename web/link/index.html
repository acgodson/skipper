<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sign in · SkipperDesk</title>
<link rel="stylesheet" href="/assets/styles.css?v=1">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
</head>
<body>

<header class="site">
	<a class="mark" href="/">
		<img src="/assets/mark.svg" width="28" height="28" alt="">
		SkipperDesk
	</a>
</header>

<main>
	<section class="hero stack-s">
		<h1>Sign in to SkipperDesk</h1>

		<div class="row" id="working">
			<span class="spinner" aria-hidden="true"></span>
			<p class="caption" id="working-text">One moment…</p>
		</div>

		<div class="banner hidden" id="message" role="status">
			<strong id="message-title"></strong>
			<p class="caption" id="message-body"></p>
		</div>

		<div class="actions hidden" id="actions">
			<a class="button" id="handoff" href="#">Open SkipperDesk</a>
		</div>
	</section>
</main>

<footer class="site">SkipperDesk</footer>

<script src="/config.js"></script>
<script src="/assets/link.js?v=1"></script>

</body>
</html>
